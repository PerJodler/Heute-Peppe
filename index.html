<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f8f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gewicht">
<title>Gewicht Tracker</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#17352a;background:#eaf1ed}*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at top,#fff 0,#edf4f0 38%,#e6eeea 100%)}button,input{font:inherit}.app-shell{min-height:100dvh;display:flex;justify-content:center}.phone{width:100%;max-width:480px;min-height:100dvh;background:#f5f8f6;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 92px);position:relative}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.topbar small{letter-spacing:1.4px;color:#2a9b68;font-weight:800;font-size:11px}.topbar h1{font-size:30px;margin:4px 0 0;letter-spacing:-1px}.icon{border:0;background:#fff;border-radius:50%;height:42px;width:42px;font-size:20px;box-shadow:0 5px 18px #17352a12}.hero{background:linear-gradient(145deg,#d9f4e6,#bfead7);padding:22px;border-radius:27px;box-shadow:0 12px 30px #277f5b14;margin-bottom:14px}.hero span,.stats span,.card p,.entry span{color:#6d8179;font-size:13px}.hero strong{display:block;font-size:43px;letter-spacing:-1.5px;margin:7px 0}.good{color:#168a56!important}.warn{color:#b96349!important}.primary{width:100%;border:0;border-radius:16px;background:#17955f;color:#fff;font-weight:800;padding:15px 18px;margin-top:16px;box-shadow:0 7px 18px #17955f30}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stats article{background:#fff;border-radius:19px;padding:15px 12px;box-shadow:0 6px 22px #17352a0a;min-width:0}.stats b{font-size:17px;display:block;margin-top:6px}.card{background:#fff;border-radius:23px;padding:18px;margin:14px 0;box-shadow:0 7px 24px #17352a0b}.card.full{min-height:65vh}.section-head{display:flex;align-items:center;justify-content:space-between}.section-head h2,.card h2,.sheet h2{margin:0;font-size:19px}.textbtn,.danger,.reset{border:0;background:none}.textbtn{color:#188b5a;font-weight:700}.chart{display:block;width:100%;height:auto;margin-top:8px}.grid{stroke:#e8efeb;stroke-width:1}.line{stroke:#159361;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#fff;stroke:#159361;stroke-width:3}.progress{height:11px;border-radius:999px;background:#e4ede8;overflow:hidden;margin:16px 0 7px}.progress i{display:block;height:100%;background:#1b9863;border-radius:inherit}.entry{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf2ef;padding:14px 2px}.entry div{display:flex;flex-direction:column;gap:4px}.entry b{font-size:17px}.danger{color:#b96349;font-weight:700}.reset{color:#7f8f88;margin-top:24px;width:100%;padding:10px}.empty{text-align:center;color:#71837c;padding:28px 0}nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:#ffffffed;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid #e9efeb;padding:8px 24px calc(env(safe-area-inset-bottom) + 9px);display:grid;grid-template-columns:repeat(3,1fr);z-index:4}nav button{border:0;background:none;color:#7c8b85;font-size:21px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}nav button span{font-size:10px}nav .active{color:#159361}.overlay{position:fixed;z-index:10;inset:0;background:#0d251c66;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:480px;background:#f8fbf9;border-radius:28px 28px 0 0;padding:14px 22px calc(env(safe-area-inset-bottom) + 28px);box-shadow:0 -20px 60px #0002}.grab{height:5px;width:42px;border-radius:9px;background:#cbd8d2;margin:0 auto 18px}.sheet label{display:block;color:#687c74;font-weight:700;font-size:13px;margin:18px 0 6px}.sheet input[type=date]{width:100%;border:1px solid #dde8e2;background:#fff;padding:14px;border-radius:14px;color:#17352a}.weight-input{display:flex;align-items:center;background:#fff;border:1px solid #dde8e2;border-radius:18px;padding:10px 16px}.weight-input input{min-width:0;width:100%;border:0;outline:0;background:transparent;font-size:42px;font-weight:800;color:#17352a;text-align:center}.weight-input span{font-size:18px;color:#71837c}.secondary{width:100%;border:0;background:transparent;color:#667a72;font-weight:700;padding:14px;margin-top:4px}@media(min-width:700px){.app-shell{padding:34px}.phone{min-height:850px;border-radius:46px;box-shadow:0 32px 90px #163c2e2b;border:8px solid #1a1d1b;overflow:hidden}nav{bottom:34px;border-radius:0 0 37px 37px}}
</style>
</head>
<body>
<div class="app-shell"><main class="phone"><header class="topbar"><div><small>GEWICHT TRACKER</small><h1 id="title">Dein Fortschritt</h1></div><button class="icon" id="goalBtn" aria-label="Ziel ändern">⚙︎</button></header><div id="content"></div><nav><button data-screen="home" class="active">⌂<span>Heute</span></button><button data-screen="chart">⌁<span>Verlauf</span></button><button data-screen="history">▤<span>Einträge</span></button></nav></main></div><div id="modal"></div>
<script>
const seed=[['2026-08-06',83.6],['2026-08-07',83.3],['2026-08-08',83.1],['2026-08-09',82.9],['2026-08-10',83.0],['2026-08-11',82.7],['2026-08-12',82.6],['2026-08-13',82.4]].map((x,i)=>({id:'demo-'+i,date:x[0],weight:x[1]}));
let entries=JSON.parse(localStorage.getItem('gewicht.entries')||'null')||seed;let goal=Number(localStorage.getItem('gewicht.goal')||78);let screen='home';
const $=s=>document.querySelector(s), fmt=n=>Number(n).toFixed(1).replace('.',','), today=()=>new Date().toISOString().slice(0,10), dateFmt=(d,opt={day:'2-digit',month:'short'})=>new Intl.DateTimeFormat('de-DE',opt).format(new Date(d+'T12:00:00'));
function save(){localStorage.setItem('gewicht.entries',JSON.stringify(entries));localStorage.setItem('gewicht.goal',goal)}function sorted(){return [...entries].sort((a,b)=>a.date.localeCompare(b.date))}
function stats(){const a=sorted(),latest=a.at(-1)?.weight??null,first=a[0]?.weight??latest,seven=a.slice(-7),avg=seven.length?seven.reduce((s,e)=>s+e.weight,0)/seven.length:null,change=a.length>1?latest-a.at(-2).weight:0,trend=seven.length>1?seven.at(-1).weight-seven[0].weight:0,progress=latest!=null&&first!==goal?Math.max(0,Math.min(1,(first-latest)/(first-goal))):0;return{a,latest,first,seven,avg,change,trend,progress}}
function chart(a){const data=a.slice(-12);if(data.length<2)return '<div class="empty">Mindestens zwei Einträge für den Verlauf.</div>';const vals=data.map(e=>e.weight),min=Math.min(...vals)-.4,max=Math.max(...vals)+.4,W=640,H=230,p=24,pts=data.map((e,i)=>({x:p+i*(W-2*p)/(data.length-1),y:p+(max-e.weight)*(H-2*p)/(max-min)})),poly=pts.map(p=>p.x+','+p.y).join(' '),gr=[0,1,2,3].map(i=>`<line x1="${p}" x2="${W-p}" y1="${p+i*(H-2*p)/3}" y2="${p+i*(H-2*p)/3}" class="grid"/>`).join(''),dots=pts.map((q,i)=>`<circle cx="${q.x}" cy="${q.y}" r="${i===pts.length-1?7:4}" class="dot"/>`).join('');return `<svg class="chart" viewBox="0 0 ${W} ${H}">${gr}<polyline points="${poly}" fill="none" class="line"/>${dots}</svg>`}
function render(){const s=stats();$('#title').textContent=screen==='home'?'Dein Fortschritt':screen==='history'?'Einträge':'Verlauf';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));let h='';if(screen==='home'){h=`<section class="hero"><span>Aktuelles Gewicht</span><strong>${s.latest?fmt(s.latest)+' kg':'–'}</strong><div class="${s.change<=0?'good':'warn'}">${s.change>0?'+':''}${fmt(s.change)} kg seit letztem Eintrag</div><button class="primary" id="addBtn">＋ Gewicht eintragen</button></section><section class="stats"><article><span>7-Tage-Ø</span><b>${s.avg?fmt(s.avg)+' kg':'–'}</b></article><article><span>Zielgewicht</span><b>${fmt(goal)} kg</b></article><article><span>Trend</span><b class="${s.trend<=0?'good':'warn'}">${s.trend>0?'+':''}${fmt(s.trend)} kg</b></article></section><section class="card"><div class="section-head"><h2>Verlauf</h2><button class="textbtn" data-go="chart">Details</button></div>${chart(s.a)}</section><section class="card"><div class="section-head"><h2>Zum Ziel</h2><b>${Math.round(s.progress*100)}%</b></div><div class="progress"><i style="width:${Math.max(2,s.progress*100)}%"></i></div><p>${s.latest?'Noch '+fmt(Math.max(0,s.latest-goal))+' kg bis zum Ziel.':'Trage dein erstes Gewicht ein.'}</p></section><section class="card"><div class="section-head"><h2>Letzte Einträge</h2><button class="textbtn" data-go="history">Alle</button></div>${s.a.slice(-4).reverse().map(e=>`<div class="entry"><span>${dateFmt(e.date)}</span><b>${fmt(e.weight)} kg</b></div>`).join('')}</section>`}else if(screen==='chart'){const low=s.a.length?fmt(Math.min(...s.a.map(e=>e.weight)))+' kg':'–',high=s.a.length?fmt(Math.max(...s.a.map(e=>e.weight)))+' kg':'–';h=`<section class="card full">${chart(s.a)}<div class="stats"><article><span>Tiefster Wert</span><b>${low}</b></article><article><span>Höchster Wert</span><b>${high}</b></article><article><span>7-Tage-Ø</span><b>${s.avg?fmt(s.avg)+' kg':'–'}</b></article></div><h2>7-Tage-Trend</h2><p class="${s.trend<=0?'good':'warn'}">${s.trend>0?'+':''}${fmt(s.trend)} kg</p></section>`}else{h=`<section class="card full"><button class="primary" id="addBtn">＋ Neuer Eintrag</button>${s.a.length?'':'<p class="empty">Noch keine Einträge.</p>'}${s.a.slice().reverse().map(e=>`<div class="entry"><div><span>${dateFmt(e.date,{weekday:'short',day:'2-digit',month:'long'})}</span><b>${fmt(e.weight)} kg</b></div><button class="danger" data-del="${e.id}">Löschen</button></div>`).join('')}<button class="reset" id="resetBtn">Testdaten löschen</button></section>`}$('#content').innerHTML=h;$('#addBtn')?.addEventListener('click',()=>weightModal());document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{screen=b.dataset.go;render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{entries=entries.filter(e=>e.id!==b.dataset.del);save();render()});$('#resetBtn')?.addEventListener('click',()=>{if(confirm('Alle lokalen Testdaten löschen?')){entries=[];save();render()}})}
function weightModal(){ $('#modal').innerHTML=`<div class="overlay" id="overlay"><div class="sheet"><div class="grab"></div><h2>Gewicht eintragen</h2><label>Datum<input type="date" id="date" value="${today()}"></label><label>Gewicht<div class="weight-input"><input inputmode="decimal" id="weight" placeholder="82,4"><span>kg</span></div></label><button class="primary" id="saveWeight">Speichern</button><button class="secondary" id="cancel">Abbrechen</button></div></div>`;$('#cancel').onclick=closeModal;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};$('#saveWeight').onclick=()=>{const n=Number($('#weight').value.replace(',','.')),d=$('#date').value;if(!(n>=30&&n<=400))return alert('Bitte gib ein realistisches Gewicht ein.');const same=entries.find(e=>e.date===d);entries=same?entries.map(e=>e.date===d?{...e,weight:n}:e):[...entries,{id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),date:d,weight:n}];save();closeModal();render()}}
function goalModal(){ $('#modal').innerHTML=`<div class="overlay" id="overlay"><div class="sheet"><div class="grab"></div><h2>Zielgewicht</h2><div class="weight-input"><input inputmode="decimal" id="goal" value="${String(goal).replace('.',',')}"><span>kg</span></div><button class="primary" id="saveGoal">Ziel speichern</button><button class="secondary" id="cancel">Abbrechen</button></div></div>`;$('#cancel').onclick=closeModal;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};$('#saveGoal').onclick=()=>{const n=Number($('#goal').value.replace(',','.'));if(!(n>=30&&n<=400))return alert('Bitte gib ein realistisches Ziel ein.');goal=n;save();closeModal();render()}}
function closeModal(){$('#modal').innerHTML=''}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{screen=b.dataset.screen;render()});$('#goalBtn').onclick=goalModal;render();
</script>
</body></html>
